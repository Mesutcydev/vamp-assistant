<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #9A9A9E; } a:hover { color: #F2F2F4; }
    .screen { position: relative; width: 390px; height: 844px; overflow: hidden;
      background: #0F0F10; color: #F2F2F4; }
    .atmos { position: absolute; inset: 0; background-image: url("atmosphere.jpg");
      background-size: cover; background-position: center; filter: grayscale(1);
      opacity: 0.13; pointer-events: none; }
    .layer { position: relative; height: 100%; display: flex; flex-direction: column; }
    .glass { background: rgba(26,26,28,0.72); -webkit-backdrop-filter: blur(24px) saturate(1.4);
      backdrop-filter: blur(24px) saturate(1.4); border: 0.75px solid rgba(255,255,255,0.13);
      box-shadow: 0 8px 22px rgba(0,0,0,0.46), inset 0 0.75px 0 rgba(255,255,255,0.10); border-radius: 18px; }
    .well { background: rgba(37,37,40,0.58); border-radius: 12px; }
    .cap { font-size: 11px; font-weight: 600; letter-spacing: 0.9px; text-transform: uppercase;
      color: rgba(242,242,244,0.62); }
    .t1 { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 41px; }
    .h  { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; }
    .b  { font-size: 17px; letter-spacing: -0.4px; line-height: 25px; }
    .sub { font-size: 15px; color: rgba(242,242,244,0.62); letter-spacing: -0.2px; }
    .fn { font-size: 13px; color: rgba(242,242,244,0.62); }
    .c2 { font-size: 11px; color: rgba(242,242,244,0.38); }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 13px; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; }
    .div { height: 0.75px; background: rgba(255,255,255,0.09); }
    .stack { display: flex; flex-direction: column; }
    .navpill { width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center;
      justify-content: center; background: rgba(37,37,40,0.58); border: 0.75px solid rgba(255,255,255,0.13); }
    .chip { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
      background: rgba(37,37,40,0.58); border: 0.75px solid rgba(255,255,255,0.13); font-size: 13px; font-weight: 500; }
  </style>
</helmet>
<div class="screen">
  <div class="atmos"></div>
  <div class="layer">
    <div style="display:flex;align-items:center;padding:12px 16px 14px;border-bottom:0.75px solid rgba(255,255,255,0.09)">
      <div class="b" style="color:#9A9A9E;font-size:16px">Cancel</div>
      <div class="h" style="flex:1;text-align:center">New session</div>
      <div style="width:52px"></div>
    </div>

    <div style="padding:16px 18px 0;display:flex;flex-direction:column;gap:20px">
      <div class="glass">
        <div style="padding:14px;min-height:104px">
          <div class="b" style="color:rgba(242,242,244,0.38)">What should it work on?</div>
        </div>
        <div class="div"></div>
        <div style="display:flex;gap:8px;padding:10px 12px;overflow:hidden">
          <div class="chip" style="flex:none">Plan this task</div>
          <div class="chip" style="flex:none">Explain this project</div>
          <div class="chip" style="flex:none">Help me…</div>
        </div>
      </div>

      <div>
        <div class="cap" style="padding:0 2px 8px">Setup</div>
        <div class="glass">
          <div class="row">
        <div style="width:26px;height:26px;border-radius:8px;background:rgba(37,37,40,0.58);display:flex;align-items:center;justify-content:center;flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A9A9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 012-2h12a2 2 0 012 2v7a2 2 0 01-2 2H9l-5 4z"/></svg></div>
        <div style="font-size:15px;font-weight:500">Works in</div>
        <div style="flex:1"></div>
        <div style="text-align:right"><div class="sub">Chat only</div></div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(242,242,244,0.38)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div><div class="div" style="margin-left:14px"></div>
          <div class="row">
        <div style="width:26px;height:26px;border-radius:8px;background:rgba(37,37,40,0.58);display:flex;align-items:center;justify-content:center;flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A9A9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3.2"/><path d="M5.5 20c0-3.4 2.9-6 6.5-6s6.5 2.6 6.5 6"/></svg></div>
        <div style="font-size:15px;font-weight:500">Bot</div>
        <div style="flex:1"></div>
        <div style="text-align:right"><div class="sub">Assistant</div></div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(242,242,244,0.38)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div><div class="div" style="margin-left:14px"></div>
          <div class="row">
        <div style="width:26px;height:26px;border-radius:8px;background:rgba(37,37,40,0.58);display:flex;align-items:center;justify-content:center;flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A9A9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v3M14 3v3M10 18v3M14 18v3M3 10h3M3 14h3M18 10h3M18 14h3"/></svg></div>
        <div style="font-size:15px;font-weight:500">Model</div>
        <div style="flex:1"></div>
        <div style="text-align:right"><div class="sub">Qwen3.5 9B MLX</div><div class="c2" style="margin-top:1px">9B · 4-bit</div></div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(242,242,244,0.38)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
        </div>
        <div class="fn" style="padding:8px 2px 0">Starts with the folder, bot and model you used last.</div>
      </div>

      <div>
        <div class="cap" style="padding:0 2px 8px">More</div>
        <div class="glass">
          <div class="row">
        <div style="width:26px;height:26px;border-radius:8px;background:rgba(37,37,40,0.58);display:flex;align-items:center;justify-content:center;flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A9A9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5A3 3 0 006 7.5 2.6 2.6 0 004.5 10 2.6 2.6 0 006 12.4 3 3 0 009 15.5"/><path d="M15 4.5a3 3 0 013 3 2.6 2.6 0 011.5 2.5A2.6 2.6 0 0118 12.4a3 3 0 01-3 3"/><path d="M12 4v16"/></svg></div>
        <div style="font-size:15px;font-weight:500">Reasoning</div>
        <div style="flex:1"></div>
        <div style="text-align:right"><div class="sub">Auto</div></div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(242,242,244,0.38)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div><div class="div" style="margin-left:14px"></div>
          <div class="row">
        <div style="width:26px;height:26px;border-radius:8px;background:rgba(37,37,40,0.58);display:flex;align-items:center;justify-content:center;flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A9A9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></div>
        <div style="font-size:15px;font-weight:500">Sandboxes &amp; keys</div>
        <div style="flex:1"></div>
        <div style="text-align:right"><div class="sub"></div></div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(242,242,244,0.38)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
        </div>
      </div>
    </div>

    <div style="flex:1"></div>
    <div style="padding:12px 20px 18px;border-top:0.75px solid rgba(255,255,255,0.09);background:rgba(26,26,28,0.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)">
      <div class="fn" style="padding-bottom:8px">Type what you want done.</div>
      <div style="height:50px;border-radius:25px;background:rgba(37,37,40,0.58);border:0.75px solid rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center">
        <div class="h" style="color:rgba(242,242,244,0.38)">Start session</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
