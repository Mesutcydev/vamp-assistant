name: Apple apps

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be built and packaged on demand, without opening a pull
  # request first — the IPA job below only runs this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} tests and Release build
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # XCTest must forward this for tests that invoke xcodebuild themselves.
      TEST_RUNNER_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and check hygiene
        run: |
          xcodegen generate
          git diff --check
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: macOS unit tests
        if: matrix.platform == 'macOS'
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme BeetCode
          -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/Derived"
          -resultBundlePath "$RUNNER_TEMP/Tests.xcresult"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES
          -skipPackagePluginValidation -skipMacroValidation
          -only-testing:BeetCodeTests test
      - name: iOS simulator tests
        if: matrix.platform == 'iOS'
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme BeetCodeRemoteIOS
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -derivedDataPath "$RUNNER_TEMP/Derived" -resultBundlePath "$RUNNER_TEMP/Tests.xcresult"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -skipPackagePluginValidation -skipMacroValidation test
      - name: macOS Release build
        if: matrix.platform == 'macOS'
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme BeetCode -configuration Release
          -destination 'generic/platform=macOS' ARCHS=arm64 EXCLUDED_ARCHS=x86_64 -derivedDataPath "$RUNNER_TEMP/Derived"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -skipPackagePluginValidation -skipMacroValidation build
      - name: iOS device Release build
        if: matrix.platform == 'iOS'
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme BeetCodeRemoteIOS -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Derived"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -skipPackagePluginValidation -skipMacroValidation build
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-test-results
          path: ${{ runner.temp }}/Tests.xcresult
          retention-days: 7

  ipa:
    name: Sideloadable IPA
    # Only on demand: packaging is not part of the per-PR gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # DEVELOPER_DIR is deliberately unset: the packaging script resolves the
      # toolchain itself and prints which one it used.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Package unsigned IPA
        run: ./scripts/package-beetcode-remote-ios.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vamp-assistant-ios-ipa
          path: |
            dist/*.ipa
            dist/*.sha256
          retention-days: 14

  screens:
    name: Simulator screenshots
    # On demand only: this exists so a reviewer (or an agent with no Mac) can
    # look at the real screens without pairing hardware.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for the simulator
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme BeetCodeRemoteIOS
          -configuration Debug -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -derivedDataPath "$RUNNER_TEMP/Derived"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -skipPackagePluginValidation -skipMacroValidation build
      - name: Shoot every screen, light and dark
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Debug-iphonesimulator/Vamp Assistant.app"
          BUNDLE=com.beetcode.remote.ios
          OUT="$RUNNER_TEMP/screens"
          mkdir -p "$OUT"
          DEVICE=$(xcrun simctl create harness com.apple.CoreSimulator.SimDeviceType.iPhone-17)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          for appearance in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$appearance"
            for screen in sessions conversation new-session settings bots share computers; do
              xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch --terminate-running-process \
                "$DEVICE" "$BUNDLE" \
                --setenv VAMP_REMOTE_TEST_SCREEN="$screen" >/dev/null
              # The first frame is a blank window; give SwiftUI a moment to
              # lay out and the backdrop image to decode.
              sleep 4
              xcrun simctl io "$DEVICE" screenshot "$OUT/$appearance-$screen.png"
            done
          done
          xcrun simctl shutdown "$DEVICE"
          ls -la "$OUT"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screens
          path: ${{ runner.temp }}/screens
          retention-days: 14
